# Name of your workflow
name: Python CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events for the "main" branch
  push:
    branches: ["main"]
  # Triggers the workflow on pull request events targeting the "main" branch
  pull_request:
    branches: ["main"]

# Default to read-only permissions; elevate only in the coverage job.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref
# (e.g. a PR branch), so superseded runs don't tie up CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Lint and type-check once, on one interpreter. Running these in every
  # matrix leg wasted time and — worse — checked with *different* tool
  # versions per interpreter.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      # Deliberately unpinned (uv.lock is not consulted): CI exercises fresh
      # dependency releases before users hit them. uv just installs faster.
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,csv]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type check with Mypy
        run: mypy src tests/typing/public_api_positive.py

      - name: Type check with Ty
        run: ty check src tests/typing/public_api_positive.py

  # The deploy workflow builds docs only after merge; this catches broken
  # links, nav entries and API references on every PR.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv pip install --system -e ".[docs]"

      - name: Build documentation strictly
        run: mkdocs build --strict

  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    # The macOS leg also runs the zlib-ng suite (see below).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 25 || 15 }}
    # Defines a build matrix for your tests. Linux runs the full Python
    # version sweep; Windows runs the oldest-common (3.12) and newest (3.14)
    # versions to guard platform-specific paths (e.g. os.linesep newline
    # translation in text mode, path handling) without the full sweep's cost.
    # macOS runs 3.14 only: GitHub runs few macOS jobs at a time per account,
    # and with more macOS legs queued jobs were cancelled before they started.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Step 2: Sets up the specific version of Python from the matrix
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      # Step 3: Install dependencies. The [test] extra skips lint-only
      # tooling (ruff and prek); deliberately unpinned (uv.lock is
      # not consulted) so CI exercises fresh dependency releases.
      - name: Install dependencies
        run: uv pip install --system -e ".[test,csv]"

      # Records the interpreter, the imported package, engine selection and
      # runtime dependency versions this leg actually tested.
      - name: Attest runtime environment
        run: >-
          python scripts/report_runtime_versions.py --mode csv --latest
          --output runtime-report.json

      # This explicit check makes the supported-Python matrix the portability
      # gate for the structured runtime manifest. The test suite also covers
      # deterministic capture and intentional failure cases.
      - name: Check frozen public API manifest
        run: python scripts/capture_public_api.py --check tests/data/public_api_2_0.json

      # Step 4: Run tests with pytest and coverage
      # --cov-fail-under gates against silent coverage regressions. The
      # threshold sits several points below the current ~93% to absorb
      # benign per-platform branch differences without nuisance failures.
      - name: Run tests with pytest and coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # macOS zlib-ng wheels are built separately from Linux ones, so the macOS
      # leg repeats the suite with the [fast] extra installed. This replaces a
      # separate macOS fast-engine job (see the build matrix comment).
      - name: Install the fast extra (macOS)
        if: matrix.os == 'macos-latest'
        run: uv pip install --system -e ".[test,csv,fast]"

      - name: Attest runtime environment (macOS, zlib-ng active)
        if: matrix.os == 'macos-latest'
        run: >-
          python scripts/report_runtime_versions.py --mode fast --latest
          --output runtime-fast.json

      - name: Run tests with zlib-ng active (macOS)
        if: matrix.os == 'macos-latest'
        run: pytest -q

      # The coverage-comment job reuses this leg's coverage data instead of
      # re-running the suite. relative_files = true in [tool.coverage.run]
      # keeps the paths portable across jobs.
      - name: Upload coverage data
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true

      - name: Upload runtime attestation
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-build-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            runtime-report.json
            runtime-fast.json
          if-no-files-found: warn

  # The main matrix above installs only [test,csv], so it exercises the
  # pure-Python default (stdlib zlib, zlib-ng absent) — the common
  # `pip install aiogzip` install — across the full version/OS sweep. This
  # job adds the [fast] extra so the zlib-ng decompression and opt-in
  # compression paths are exercised on one representative version. The
  # macOS build leg covers zlib-ng on macOS, whose wheels are built
  # separately.
  fast-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies (with fast extra)
        run: uv pip install --system -e ".[test,csv,fast]"

      - name: Attest runtime environment (zlib-ng active)
        run: >-
          python scripts/report_runtime_versions.py --mode fast --latest
          --output runtime-fast.json

      - name: Attest runtime environment (stdlib forced)
        run: >-
          AIOGZIP_ENGINE=stdlib python scripts/report_runtime_versions.py
          --mode fast-forced-stdlib --latest
          --output runtime-fast-forced-stdlib.json

      - name: Run tests with zlib-ng active
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Run tests with stdlib forced (zlib-ng installed but disabled)
        run: |
          AIOGZIP_ENGINE=stdlib pytest -q

      - name: Upload runtime attestations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-fast-engine
          path: |
            runtime-fast.json
            runtime-fast-forced-stdlib.json
          if-no-files-found: warn

  # Resolve nothing implicitly in this matrix: build one wheel, install it
  # without dependencies, then add each exact runtime floor. Current test
  # tooling is intentionally separate from the runtime compatibility promise.
  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [base, csv, fast, fast-forced-stdlib]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build candidate wheel
        run: uv build --wheel --out-dir dist

      - name: Create isolated test environment
        run: |
          uv venv --python 3.11 .minimum-venv
          uv pip install --python .minimum-venv/bin/python \
            "pytest>=8,<10" "pytest-asyncio>=0.24" "pytest-timeout>=2.3.1" \
            "hypothesis>=6" \
            psutil "mypy>=1" types-aiofiles "ty>=0.0.1a16"
          uv pip install --python .minimum-venv/bin/python \
            --no-deps dist/*.whl

      - name: Install exact runtime floors
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            base)
              uv pip install --python .minimum-venv/bin/python \
                "aiofiles==23.2.1"
              ;;
            csv)
              uv pip install --python .minimum-venv/bin/python \
                "aiofiles==23.2.1" "aiocsv==1.2.3"
              ;;
            fast|fast-forced-stdlib)
              uv pip install --python .minimum-venv/bin/python \
                "aiofiles==23.2.1" "zlib-ng==0.4.0"
              ;;
          esac

      - name: Assert exact versions and engine selection
        shell: bash
        run: |
          if [[ "${{ matrix.mode }}" == "fast-forced-stdlib" ]]; then
            AIOGZIP_ENGINE=stdlib .minimum-venv/bin/python \
              scripts/report_runtime_versions.py \
              --mode "${{ matrix.mode }}" --require-installed-artifact \
              --output runtime-report.json
          else
            .minimum-venv/bin/python scripts/report_runtime_versions.py \
              --mode "${{ matrix.mode }}" --require-installed-artifact \
              --output runtime-report.json
          fi

      - name: Upload runtime attestation
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-minimum-${{ matrix.mode }}
          path: runtime-report.json

      - name: Check installed public API and typing contract
        if: matrix.mode == 'base'
        shell: bash
        run: |
          temporary_workdir="$(mktemp -d)"
          cd "$temporary_workdir"
          "$GITHUB_WORKSPACE/.minimum-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/capture_public_api.py" \
            --check "$GITHUB_WORKSPACE/tests/data/public_api_2_0.json"
          "$GITHUB_WORKSPACE/.minimum-venv/bin/python" -m mypy --strict \
            "$GITHUB_WORKSPACE/tests/typing/public_api_positive.py"
          "$GITHUB_WORKSPACE/.minimum-venv/bin/python" -m ty check \
            --python "$GITHUB_WORKSPACE/.minimum-venv" \
            --python-version 3.11 --no-progress \
            "$GITHUB_WORKSPACE/tests/typing/public_api_positive.py"

      - name: Smoke installed wheel outside checkout
        shell: bash
        run: |
          temporary_workdir="$(mktemp -d)"
          package_version="$(.minimum-venv/bin/python -c \
            'import importlib.metadata; print(importlib.metadata.version("aiogzip"))')"
          extra_arguments=()
          if [[ "${{ matrix.mode }}" == "fast" ]]; then
            extra_arguments+=(--expect-fast)
          fi
          cd "$temporary_workdir"
          if [[ "${{ matrix.mode }}" == "fast-forced-stdlib" ]]; then
            AIOGZIP_ENGINE=stdlib \
              "$GITHUB_WORKSPACE/.minimum-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/smoke_wheel.py" \
              --expected-version "$package_version"
          else
            "$GITHUB_WORKSPACE/.minimum-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/smoke_wheel.py" \
              --expected-version "$package_version" "${extra_arguments[@]}"
          fi

      - name: Run maintained examples at the base floor
        if: matrix.mode == 'base'
        shell: bash
        run: |
          temporary_workdir="$(mktemp -d)"
          cd "$temporary_workdir"
          "$GITHUB_WORKSPACE/.minimum-venv/bin/python" \
            "$GITHUB_WORKSPACE/examples/fragmented_transport.py" --self-test
          "$GITHUB_WORKSPACE/.minimum-venv/bin/python" \
            "$GITHUB_WORKSPACE/examples/concurrent_jsonl_ingest.py" \
            --generate-fixtures "$temporary_workdir/input" \
            --output "$temporary_workdir/output"

      - name: Run full applicable minimum-version suite
        shell: bash
        run: |
          arguments=(
            -q
            --deselect=tests/test_benchmark_runner.py::test_source_root_attestation_identifies_current_checkout
          )
          if [[ "${{ matrix.mode }}" != "csv" ]]; then
            arguments+=(--ignore=tests/test_aiocsv.py)
          fi
          if [[ "${{ matrix.mode }}" == "fast-forced-stdlib" ]]; then
            AIOGZIP_ENGINE=stdlib .minimum-venv/bin/python -m pytest \
              "${arguments[@]}"
          else
            .minimum-venv/bin/python -m pytest "${arguments[@]}"
          fi

  # Build and install release artifacts into clean environments outside the
  # checkout. The Python 3.11 minimum wheel row is covered above; this matrix
  # adds latest/base, fast, both artifact types, and platform packaging paths.
  installed-artifacts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            artifact: wheel
            mode: base
            run_examples: false
          - os: ubuntu-latest
            python-version: "3.12"
            artifact: wheel
            mode: fast
            run_examples: false
          - os: windows-latest
            python-version: "3.12"
            artifact: wheel
            mode: base
            run_examples: false
          - os: macos-latest
            python-version: "3.12"
            artifact: wheel
            mode: base
            run_examples: false
          - os: ubuntu-latest
            python-version: "3.12"
            artifact: sdist
            mode: base
            run_examples: true
          - os: ubuntu-latest
            python-version: "3.12"
            artifact: sdist
            mode: fast
            run_examples: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build candidate ${{ matrix.artifact }}
        shell: bash
        run: |
          uv build --${{ matrix.artifact }} --out-dir dist
          ARTIFACT_KIND=${{ matrix.artifact }} python -c '
          import os
          from pathlib import Path
          suffix = ".whl" if os.environ["ARTIFACT_KIND"] == "wheel" else ".tar.gz"
          paths = sorted(Path("dist").glob(f"*{suffix}"))
          if len(paths) != 1:
              raise SystemExit(f"expected one {suffix} artifact, got {paths!r}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              print(f"ARTIFACT_PATH={paths[0].resolve()}", file=output)
          '

      - name: Create clean environment outside checkout
        shell: bash
        run: |
          environment_root="$RUNNER_TEMP/aiogzip-artifact-venv"
          uv venv --python "${{ matrix.python-version }}" "$environment_root"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            artifact_python="$environment_root/Scripts/python.exe"
          else
            artifact_python="$environment_root/bin/python"
          fi
          echo "ARTIFACT_PYTHON=$artifact_python" >> "$GITHUB_ENV"

      - name: Install artifact and latest runtime dependencies
        shell: bash
        run: |
          uv pip install --python "$ARTIFACT_PYTHON" \
            pytest pytest-asyncio pytest-timeout aiofiles aiocsv
          if [[ "${{ matrix.mode }}" == "fast" ]]; then
            uv pip install --python "$ARTIFACT_PYTHON" zlib-ng
          fi
          uv pip install --python "$ARTIFACT_PYTHON" \
            --no-deps "$ARTIFACT_PATH"

      - name: Attest installed runtime outside checkout
        shell: bash
        run: |
          run_directory="$RUNNER_TEMP/aiogzip-runtime-report"
          mkdir -p "$run_directory"
          cd "$run_directory"
          "$ARTIFACT_PYTHON" \
            "$GITHUB_WORKSPACE/scripts/report_runtime_versions.py" \
            --mode "${{ matrix.mode == 'fast' && 'fast' || 'csv' }}" --latest \
            --require-installed-artifact \
            --output "$GITHUB_WORKSPACE/runtime-report.json"

      - name: Smoke installed artifact outside checkout
        shell: bash
        run: |
          run_directory="$RUNNER_TEMP/aiogzip-artifact-run"
          mkdir -p "$run_directory"
          package_version="$("$ARTIFACT_PYTHON" -c \
            'import importlib.metadata; print(importlib.metadata.version("aiogzip"))')"
          cd "$run_directory"
          "$ARTIFACT_PYTHON" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_artifact.py" \
            --expected-version "$package_version" \
            --expected-engine "${{ matrix.mode == 'fast' && 'zlib-ng' || 'stdlib-zlib' }}" \
            --require-aiocsv \
            --artifact "$ARTIFACT_PATH" \
            --artifact-kind "${{ matrix.artifact }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --api-script "$GITHUB_WORKSPACE/scripts/capture_public_api.py" \
            --api-manifest "$GITHUB_WORKSPACE/tests/data/public_api_2_0.json" \
            --report-output "$GITHUB_WORKSPACE/artifact-report.json"

      - name: Run maintained example success and failure scenarios
        if: matrix.run_examples
        shell: bash
        run: |
          run_directory="$RUNNER_TEMP/aiogzip-example-runner"
          mkdir -p "$run_directory"
          cd "$run_directory"
          "$ARTIFACT_PYTHON" \
            "$GITHUB_WORKSPACE/scripts/run_maintained_examples.py" \
            --repository-root "$GITHUB_WORKSPACE" \
            --report-output "$GITHUB_WORKSPACE/example-report.json"

      - name: Upload artifact validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-${{ matrix.artifact }}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.mode }}
          path: |
            artifact-report.json
            example-report.json
            runtime-report.json
          if-no-files-found: warn

  # Posts the coverage comment from the ubuntu/3.12 build leg's uploaded
  # .coverage data — no dependency install or duplicate test run needed.
  coverage-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3 (no exact tag at this commit; v3.41 is 65 commits older)
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
