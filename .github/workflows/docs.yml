name: Documentation

on:
  push:
    branches:
      - main
      - 1.x
  workflow_dispatch:

permissions:
  contents: write

# mike appends commits to gh-pages; queue deploys so two runs never
# interleave their commit/push sequences.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install .[docs] mike

      - name: Fetch existing versioned docs
        # actions/checkout restricts the fetch refspec to the triggering
        # ref, so name the local branch explicitly for mike to build on.
        run: git fetch --depth=1 origin gh-pages:gh-pages || true

      - name: Deploy versioned docs
        # Released docs are one directory per minor line (1.11, 2.0, ...).
        # On main, a stable release takes the `latest` alias (the site
        # default), a pre-release updates its minor line, and a development
        # version deploys to the single `dev` version, so `latest` never
        # serves development builds. Maintenance branches (1.x) republish
        # their minor line without touching aliases — existing aliases stay
        # attached, so a 1.11 patch keeps updating `latest` for as long as
        # `latest` still points at 1.11.
        run: |
          VERSION="$(python -c 'import aiogzip; print(aiogzip.__version__)')"
          read -r DOCS_VERSION KIND <<< "$(python scripts/docs_version.py "$VERSION")"
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            mike deploy --push --title "$VERSION" "$DOCS_VERSION"
          elif [ "$KIND" = stable ]; then
            mike deploy --push --update-aliases --title "$VERSION" "$DOCS_VERSION" latest
            mike set-default --push latest
          elif [ "$KIND" = prerelease ]; then
            mike deploy --push --title "$VERSION" "$DOCS_VERSION"
          else
            mike deploy --push --title "$VERSION" dev
          fi
